apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agritrack-postgres-data
  namespace: agritrack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agritrack-postgres
  namespace: agritrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agritrack-postgres
  template:
    metadata:
      labels:
        app: agritrack-postgres
    spec:
      containers:
        - name: postgres
          image: quay.io/sclorg/postgresql-16-c9s:latest
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: agritrack-db
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agritrack-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: agritrack-postgres
  namespace: agritrack
spec:
  selector:
    app: agritrack-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
