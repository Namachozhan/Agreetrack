apiVersion: apps/v1
kind: Deployment
metadata:
  name: agritrack-backend
  namespace: agritrack
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"agritrack-backend:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"backend\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agritrack-backend
  template:
    metadata:
      labels:
        app: agritrack-backend
    spec:
      containers:
        - name: backend
          image: image-registry.openshift-image-registry.svc:5000/agritrack/agritrack-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agritrack-backend
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agritrack-backend
  namespace: agritrack
spec:
  selector:
    app: agritrack-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agritrack-frontend
  namespace: agritrack
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"agritrack-frontend:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"frontend\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agritrack-frontend
  template:
    metadata:
      labels:
        app: agritrack-frontend
    spec:
      containers:
        - name: frontend
          image: image-registry.openshift-image-registry.svc:5000/agritrack/agritrack-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agritrack-frontend
  namespace: agritrack
spec:
  selector:
    app: agritrack-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: agritrack
  namespace: agritrack
spec:
  to:
    kind: Service
    name: agritrack-frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
